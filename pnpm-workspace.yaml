minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@thenamespace/*"
blockExoticSubdeps: true
packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@parcel/watcher": false
  bufferutil: false
  es5-ext: false
  esbuild: false
  keccak: false
  lefthook: true
  utf-8-validate: false
  vue-demi: false
engineStrict: true
overrides:
  "tailwind-merge": "3.4.0"
catalog:
  "oxfmt": "0.61.0"
  "oxlint": "1.76.0"
  "react": "19.2.8"
  "react-dom": "19.2.8"
  "tailwindcss": "4.3.3"
  "@tailwindcss/cli": "4.3.3"
  "@tailwindcss/vite": "4.3.3"
  "@tanstack/react-query": "5.101.4"
  "@thenamespace/uikit": "0.3.0"
  "viem": "2.55.10"
  "wagmi": "2.19.5"
  "@types/react": "19.2.17"
  "@types/node": "26.1.1"
  "@types/react-dom": "19.2.3"
  "typescript": "6.0.3"
  "tsdown": "0.22.14"
  "turbo": "2.10.7"
